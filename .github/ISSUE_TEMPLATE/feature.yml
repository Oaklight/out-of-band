name: Feature request
description: A problem the current design does not cover.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to gate, and what happens today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool or the documentation do differently?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or policy changes you tried.
  - type: checkboxes
    id: boundary
    attributes:
      label: Scope
      options:
        - label: This is about the mechanism (receipt, signing, verification, publishing), not a specific job or policy.
          required: false
        - label: I read the non-goals in the README and SPEC.md.
          required: true
