name: summary probe
description: Diagnostic only. Remove once the step summary behavior is known.
runs:
  using: composite
  steps:
    - name: first nested write
      shell: bash
      run: |
        echo "composite-first" >> "$GITHUB_STEP_SUMMARY"
        echo "nested path=$GITHUB_STEP_SUMMARY size=$(wc -c < "$GITHUB_STEP_SUMMARY")"
    - name: second nested write
      shell: bash
      run: |
        echo "composite-second" >> "$GITHUB_STEP_SUMMARY"
        echo "nested2 path=$GITHUB_STEP_SUMMARY size=$(wc -c < "$GITHUB_STEP_SUMMARY")"
