name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.2"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  zipapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_zipapp.py
      - run: python dist/oob.pyz --version
      - run: ./dist/oob.pyz --version
      - name: sign and verify with the archive alone
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          work=$(mktemp -d)
          git init -q "$work/repo"
          echo hi > "$work/repo/f.txt"
          git -C "$work/repo" add f.txt
          git -C "$work/repo" commit -qm init
          sha=$(git -C "$work/repo" rev-parse HEAD)
          mkdir -p "$work/ev"
          echo "loss 1.23" > "$work/ev/log.txt"
          ssh-keygen -q -t ed25519 -N "" -f "$work/key"
          echo "operator $(cat "$work/key.pub")" > "$work/allowed_signers"
          cd "$work/repo"
          python "$GITHUB_WORKSPACE/dist/oob.pyz" sign \
            --job smoke --commit "$sha" --result pass \
            --evidence-dir "$work/ev" --key "$work/key" \
            --repo Oaklight/out-of-band --out "$work/receipt.md"
          cd "$work"
          python "$GITHUB_WORKSPACE/dist/oob.pyz" verify \
            --block receipt.md --allowed-signers allowed_signers \
            --repo Oaklight/out-of-band --commit "$sha" --expect-job smoke
