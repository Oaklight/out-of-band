name: oob verify

on:
  workflow_call:
    inputs:
      pr:
        description: PR number for comment collection and the sticky comment; 0 disables both
        type: string
        default: "0"
      commit:
        description: Expected head SHA
        type: string
        required: true
      job:
        description: Job name the receipt must carry
        type: string
        required: true
      required:
        description: Whether this PR needs a receipt at all
        type: boolean
        default: true
      check-name:
        description: Check run name; this is what branch protection matches
        type: string
        default: oob
      receipt:
        description: Receipt text passed directly; takes precedence over comments
        type: string
        default: ""
      allowed-signers:
        description: Path in the caller repository, read from the default branch
        type: string
        default: .github/allowed_signers
      trusted-authors:
        description: Comma-separated logins allowed to supply a receipt
        type: string
        default: ""
      evidence-url:
        description: HTTPS URL of a .tar.gz evidence bundle; used when evidence-file is empty
        type: string
        default: ""
      evidence-file:
        description: Path to the evidence .tar.gz on the runner; takes precedence over evidence-url
        type: string
        default: ""
      report:
        description: Publish a check run; false computes the verdict without one
        type: boolean
        default: true
      source-ref:
        description: Internal checkout ref for the tool repository's self-test; ignored for other repositories
        type: string
        default: ""
      require-evidence:
        description: Require an evidence archive whose digest matches the receipt
        type: boolean
        default: true
    outputs:
      verdict:
        description: verified, failed, unverified, or not applicable
        value: ${{ jobs.verify.outputs.verdict }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  OOB_VERSION: "0.4.1"
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.publish.outputs.verdict }}
    concurrency:
      group: oob-${{ inputs.check-name }}-${{ inputs.commit }}
      cancel-in-progress: false
    steps:
      - name: Check out the caller's default branch
        uses: actions/checkout@v4
        with:
          # The tool repository's self-test points this at the pull request head
          # so it exercises unreleased code. Other repositories always get the
          # default branch, whatever source-ref says.
          ref: ${{ github.repository == 'Oaklight/out-of-band' && inputs['source-ref'] || github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install out-of-band
        run: |
          if [ "$GITHUB_REPOSITORY" = "Oaklight/out-of-band" ]; then
            pip install .
          else
            pip install "out-of-band==${OOB_VERSION}"
          fi

      - name: Resolve receipt
        id: resolve
        env:
          PR: ${{ inputs.pr }}
          RECEIPT: ${{ inputs.receipt }}
          TRUSTED: ${{ inputs.trusted-authors }}
          COMMIT: ${{ inputs.commit }}
          JOB: ${{ inputs.job }}
        run: python -m oob.workflow collect

      - name: Verify receipt
        id: verify
        if: ${{ inputs.required && steps.resolve.outputs.found == 'true' }}
        env:
          ALLOWED: ${{ inputs.allowed-signers }}
          COMMIT: ${{ inputs.commit }}
          JOB: ${{ inputs.job }}
        run: |
          set +e
          oob verify \
            --block "$RUNNER_TEMP/receipt.md" \
            --allowed-signers "$ALLOWED" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" \
            --expect-job "$JOB" \
            --json > "$RUNNER_TEMP/verdict.json"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fetch and check evidence
        id: evidence
        if: ${{ inputs.required && steps.resolve.outputs.found == 'true' && (inputs.evidence-url != '' || inputs['evidence-file'] != '' || inputs['require-evidence']) && (steps.verify.outputs.exit == '0' || steps.verify.outputs.exit == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.evidence-url }}
          FILE: ${{ inputs['evidence-file'] }}
        run: |
          set +e
          if [ -n "$FILE" ]; then
            if [ ! -f "$FILE" ]; then
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cp "$FILE" "$RUNNER_TEMP/evidence.tgz" || {
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              exit 0
            }
          else
            url="$URL"
            if [ -z "$url" ]; then
              url=$(python -m oob.workflow evidence-url --receipt "$RUNNER_TEMP/receipt.md" 2>/dev/null)
            fi
            if [ -z "$url" ]; then
              echo "status=missing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only send the GitHub token to GitHub. Any other host must serve
            # the archive publicly or with its own signed URL.
            auth=()
            case "$url" in
              https://api.github.com/*|https://github.com/*)
                auth=(-H "Authorization: Bearer $GH_TOKEN")
                ;;
            esac
            curl -fsSL --max-time 120 --max-filesize 52428800 \
              "${auth[@]}" -o "$RUNNER_TEMP/evidence.tgz" "$url" || {
              echo "status=invalid" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          python -m oob.workflow evidence \
            --receipt "$RUNNER_TEMP/receipt.md" \
            --archive "$RUNNER_TEMP/evidence.tgz" \
            --out "$RUNNER_TEMP/evidence"
          if [ $? -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            python -m oob.workflow evidence-display --dir "$RUNNER_TEMP/evidence" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "status=invalid" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload evidence
        if: ${{ steps.evidence.outputs.status == 'ok' }}
        uses: actions/upload-artifact@v4
        with:
          name: oob-evidence
          path: ${{ runner.temp }}/evidence

      - name: Publish result
        id: publish
        env:
          REQUIRED: ${{ inputs.required }}
          FOUND: ${{ steps.resolve.outputs.found }}
          RESOLVE_CODE: ${{ steps.resolve.outputs.code }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit }}
          EVIDENCE_STATUS: ${{ steps.evidence.outputs.status }}
          COMMIT: ${{ inputs.commit }}
          JOB: ${{ inputs.job }}
          PR: ${{ inputs.pr }}
          CHECK_NAME: ${{ inputs.check-name }}
          REPORT: ${{ inputs.report }}
          REQUIRE_EVIDENCE: ${{ inputs['require-evidence'] }}
        run: python -m oob.workflow publish
