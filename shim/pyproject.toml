[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outboard"
version = "0.3.1"
description = "Deprecated: renamed to out-of-band. This release installs it and keeps the old command as an alias."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["out-of-band==0.4.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
]

[project.scripts]
outboard = "oob.cli:main"

[tool.setuptools]
packages = []
