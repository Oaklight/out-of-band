[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "out-of-band"
version = "0.4.1"
description = "Out-of-band CI receipts: sign where GitHub cannot reach, verify in Actions, publish a check."
readme = "README_en.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Peng Ding" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
keywords = [
  "ci",
  "github-actions",
  "receipts",
  "attestation",
  "code-signing",
  "ssh-signature",
  "branch-protection",
  "out-of-band",
]

[project.urls]
Homepage = "https://oaklight.github.io/out-of-band/"
Repository = "https://github.com/Oaklight/out-of-band"
Documentation = "https://github.com/Oaklight/out-of-band/tree/main/docs"
Changelog = "https://github.com/Oaklight/out-of-band/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18"]

[project.scripts]
oob = "oob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
