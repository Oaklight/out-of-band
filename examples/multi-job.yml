# Evidence is required by default: pass evidence-file or evidence-url, or
# sign claims.evidence_url.
# Two independent checks on one commit.
#
# Each job receives its own signed receipt and publishes its own check run, so
# a missing GPU receipt does not hide a passing serving receipt. The operator
# posts both blocks in one comment; collect() picks the block whose job matches.

name: receipt gate (two jobs)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  policy:
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '<!-- receipt:v1 -->'))
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.context.outputs.pr }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ "$EVENT" = "pull_request_target" ]; then
            commit="${{ github.event.pull_request.head.sha }}"
          else
            commit="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        job: [gpu-bench, serve-smoke]
    steps:
      - uses: Oaklight/out-of-band@v0.5.0
        with:
          pr: ${{ needs.policy.outputs.pr }}
          commit: ${{ needs.policy.outputs.commit }}
          job: ${{ matrix.job }}
          check-name: receipt-${{ matrix.job }}
